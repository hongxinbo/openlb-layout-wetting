schema_version: 1
case_id: minimal_ec1xt240_oas_phasefield
status: MINIMAL_240_RUN_PASS
scope_authority: docs/ACTIVE_PROJECT_SCOPE.md

geometry:
  source_layout: inputs/layouts/SIM-EC1XT240.OAS
  source_layer: 1/0
  raster_mask: geometry/ec1xt240/minimal_ec1xt240_20nm.pgm
  geometry_audit: geometry/ec1xt240/minimal_ec1xt240_20nm_audit.json
  crop_bbox_um: [-2101.3, -13000.64, -2098.9, -12999.44]
  planview_dx_m: 2.0e-8
  physical_groove_depth_m: 1.0e-4
  z_representation: fixed-depth metadata only; not z-resolved

physical_baseline:
