  surface_tension_enabled: false
  darcy_enabled: false
  pressing_enabled: false
  boundary: periodic-x representative crop with solid OAS walls
  drive: quintic-ramped uniform x lattice acceleration

numerical:
  liquid_tau: 0.8
  phase_tau: 0.8
  interface_width_cells: 5.0
  drive_acceleration_lattice: 1.0e-6
  drive_ramp_steps: 1000
  max_steps: 5000

parameter_roles:
  physical_baseline: [liquid_density_kg_m3, liquid_dynamic_viscosity_Pa_s, surface_tension_N_m, physical_groove_depth_m]
  numerical: [planview_dx_m, liquid_tau, phase_tau, interface_width_cells]
  study_variable: [surface_tension_N_m, contact_angle_deg, pressing_depth_m, pressing_speed, darcy_tensor_m_minus_2]
